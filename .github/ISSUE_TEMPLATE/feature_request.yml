name: Feature request
description: Suggest a capability or a new detection signal
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection engine
        - VPN Hunter
        - Uninstall flow
        - UI / theme
        - Database
        - Build / CI
        - Other
    validations:
      required: true
