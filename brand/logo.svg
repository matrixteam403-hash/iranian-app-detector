<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Iranian App Detector">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2119"/>
      <stop offset="0.55" stop-color="#061310"/>
      <stop offset="1" stop-color="#030A08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.52">
      <stop offset="0" stop-color="#2EE59D" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#2EE59D" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2EE59D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2EE59D" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0E9C6A" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="edge" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7CF7C6"/>
      <stop offset="0.5" stop-color="#2EE59D"/>
      <stop offset="1" stop-color="#0FA46F"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#2EE59D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2EE59D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M256 112 L356 150 V252 C356 320 313 370 256 398 C199 370 156 320 156 252 V150 Z"/>
    </clipPath>
  </defs>

  <!-- squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="248" r="212" fill="url(#glow)"/>

  <!-- faint concentric guides -->
  <g fill="none" stroke="#2EE59D" stroke-opacity="0.10" stroke-width="1.6">
    <circle cx="256" cy="266" r="150"/>
    <circle cx="256" cy="266" r="104"/>
  </g>

  <!-- shield body -->
  <path d="M256 112 L356 150 V252 C356 320 313 370 256 398 C199 370 156 320 156 252 V150 Z"
        fill="url(#shieldFill)" stroke="url(#edge)" stroke-width="11" stroke-linejoin="round"/>

  <!-- inner radar -->
  <g clip-path="url(#shieldClip)">
    <!-- rotating sweep -->
    <path d="M256 266 L256 128 A138 138 0 0 1 353 197 Z" fill="url(#sweep)" opacity="0.85"/>
    <!-- range arcs -->
    <g fill="none" stroke="#2EE59D" stroke-linecap="round">
      <path d="M212 266 A44 44 0 0 1 256 222" stroke-width="8" stroke-opacity="0.95"/>
      <path d="M180 266 A76 76 0 0 1 256 190" stroke-width="8" stroke-opacity="0.55"/>
      <path d="M148 266 A108 108 0 0 1 256 158" stroke-width="8" stroke-opacity="0.28"/>
    </g>
    <!-- crosshair ticks -->
    <g stroke="#2EE59D" stroke-width="6" stroke-linecap="round" stroke-opacity="0.45">
      <path d="M256 306 v18"/>
      <path d="M296 266 h18"/>
      <path d="M216 266 h-18"/>
    </g>
  </g>

  <!-- core -->
  <circle cx="256" cy="266" r="17" fill="#081B14"/>
  <circle cx="256" cy="266" r="11" fill="#2EE59D"/>
  <circle cx="252" cy="262" r="3.4" fill="#EAFFF6" opacity="0.9"/>

  <!-- detection blips -->
  <g>
    <circle cx="312" cy="206" r="9" fill="#2EE59D"/>
    <circle cx="205" cy="228" r="6" fill="#FFB74D" opacity="0.9"/>
    <circle cx="300" cy="320" r="6" fill="#2EE59D" opacity="0.65"/>
  </g>
</svg>
